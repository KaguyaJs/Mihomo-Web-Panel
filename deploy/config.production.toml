listen = "127.0.0.1:8787"
public_origin = "https://panel.example.com"
data_dir = "/var/lib/mihomo-web"
secure_cookies = true
trusted_proxies = ["127.0.0.1/32", "::1/128"]
trusted_backend_networks = []
