name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      timestamp: ${{ steps.version.outputs.timestamp }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Validate version and exact tag commit
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/release-metadata.py --tag "$RELEASE_TAG"

  verify:
    needs: metadata
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.metadata.outputs.commit }}
    permissions:
      contents: read

  build:
    name: Build Linux ${{ matrix.arch }}
    needs: [metadata, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.timestamp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}
      - name: Install native musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build frontend
        run: |
          npm --prefix web ci
          npm --prefix web run build
      - name: Build static programs and run target tests
        run: |
          export "CC_${TARGET//-/_}=musl-gcc"
          target_linker="CARGO_TARGET_${TARGET^^}_LINKER"
          target_linker="${target_linker//-/_}"
          export "$target_linker=musl-gcc"
          cargo build --release --locked --target "$TARGET" --bins --examples
          cargo test --release --locked --target "$TARGET" --all-targets
      - name: Real target-architecture systemd validation
        run: |
          sudo env \
            MIHOMO_SMOKE_BIN_DIR="$PWD/target/$TARGET/release" \
            MIHOMO_SMOKE_MOCK="$PWD/target/$TARGET/release/examples/mock_mihomo" \
            python3 tests/systemd_smoke.py
      - name: Collect licenses and verify binary archive
        run: |
          python scripts/generate-notices.py --target "$TARGET"
          python scripts/package-release.py --target "$TARGET" --tag "$RELEASE_TAG" --binary-only
          python scripts/verify-archives.py --architecture "$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: dist/*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  source:
    name: Package source
    needs: [metadata, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.timestamp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Validate and package source
        run: |
          python scripts/check-repository.py
          python scripts/package-release.py --tag "$RELEASE_TAG" --source-only
          python scripts/verify-archives.py --source-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-source
          path: dist/*-source.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified GitHub Release
    needs: [metadata, build, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify the complete release
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          python scripts/verify-archives.py --complete
          python scripts/release-metadata.py --tag "$RELEASE_TAG"
      - name: Upload all files and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          remote_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          test "$remote_commit" = "$RELEASE_COMMIT"
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > .tools/release-state.txt 2>/dev/null; then
            if [ "$(cat .tools/release-state.txt)" != true ]; then
              echo 'This version is already published. Create a new version tag.' >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --notes-file .tools/release-notes.md
          else
            options=()
            if [ "$PRERELEASE" = true ]; then options+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "mihomo-web-panel $RELEASE_TAG" \
              --notes-file .tools/release-notes.md "${options[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
